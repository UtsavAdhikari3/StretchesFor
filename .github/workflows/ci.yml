name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Prevent verified media coverage regression
        run: npm run media:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: exercise-media-coverage
          path: artifacts/media-coverage.json
